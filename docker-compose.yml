services:
  # =========================================
  # Backend PHP-FPM (Laravel)
  # =========================================
  app:
    build:
      context: .                 # Usa Dockerfile del directorio actual
      dockerfile: Dockerfile
    container_name: civis-app
    restart: unless-stopped

    # Volumen para desarrollo: sincroniza archivos locales automáticamente
    volumes:
      - ./:/var/www/app
      - vendor_cache:/var/www/app/vendor
      # app_laravel:/var/www/app
      

    networks:
      - laravel
    depends_on:
      - db
    environment:
      # =========================================
      # BASE DE DATOS
      # =========================================
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=civis
      - DB_USERNAME=civis
      - DB_PASSWORD=civis_password_example
      - DATABASE_URL=postgres://civis:civis_password_example@db:5432/civis

      # =========================================
      # LARAVEL CORE
      # =========================================
      - PORT=8080
      - APP_KEY=${APP_KEY:-base64:nSviGSC8VQeAsA13TSIjUQ9DszFz0IRtHGuFrDLyhVk=}
      - APP_NAME=CIVIS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost

      # =========================================
      # CORS - Orígenes permitidos
      # =========================================
      # Se incluye *.pages.dev para permitir peticiones desde Cloudflare Pages
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://civis.local,https://tu-proyecto.pages.dev,https://*.pages.dev

      # =========================================
      # FRONTEND - URL de la API
      # =========================================
      - FRONTEND_API_URL=https://api.civis.com/api

      # =========================================
      # SANCTUM/SESSION
      # =========================================
      # Se autoriza a pages.dev para mantener la sesión de autenticación
      - SANCTUM_STATEFUL_DOMAINS=localhost,127.0.0.1,civis.local,tu-proyecto.pages.dev
      - SESSION_DRIVER=database

    ports:
      - "80:8080"

  # =========================================
  # PostgreSQL
  # =========================================
  db:
    image: postgres:15-alpine
    container_name: civis-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: civis
      POSTGRES_USER: civis
      POSTGRES_PASSWORD: civis_password_example

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - laravel
    # Descomenta para conectar con DBeaver/TablePlus:
    ports:
      - "5432:5432"

# =========================================
# Red interna entre servicios
# =========================================
networks:
  laravel:

# =========================================
# Volumen persistente de la base de datos
# =========================================
volumes:
  db_data:
  vendor_cache:
  # storage:
  # app_laravel:
